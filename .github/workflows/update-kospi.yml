name: Update KOSPI Data

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분마다 실행
  workflow_dispatch:          # 수동 실행 허용

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch KOSPI from Naver
        run: |
          curl -s "https://m.stock.naver.com/api/index/KOSPI/basic" \
            -H "User-Agent: Mozilla/5.0" \
            -o stocks/data.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/data.json
          git diff --staged --quiet || git commit -m "Update KOSPI data"
          git push
