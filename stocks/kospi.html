<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOSPI">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>KOSPI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 20px;
    padding: 36px 40px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #8b949e;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .index-value {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.1;
    color: #e6edf3;
    margin-bottom: 16px;
  }

  .change-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    align-items: center;
  }

  .change-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 18px;
    font-weight: 700;
  }

  .up   { background: rgba(63,185,80,0.15); color: #3fb950; }
  .down { background: rgba(248,81,73,0.15);  color: #f85149; }
  .flat { background: rgba(139,148,158,0.15); color: #8b949e; }

  .arrow { font-size: 14px; }

  .divider {
    border: none;
    border-top: 1px solid #21262d;
    margin: 24px 0;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #6e7681;
  }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3fb950;
    margin-right: 5px;
    animation: blink 2s ease-in-out infinite;
  }

  .status-dot.error { background: #f85149; animation: none; }
  .status-dot.loading { background: #e3b341; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .loading-text {
    font-size: 28px;
    color: #8b949e;
    letter-spacing: 4px;
  }

  .error-msg {
    font-size: 13px;
    color: #f85149;
    margin-top: 8px;
  }

  .refresh-btn {
    margin-top: 20px;
    background: #21262d;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 13px;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s;
  }
  .refresh-btn:active { background: #30363d; }

  .market-status {
    font-size: 11px;
    color: #6e7681;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="label">KOSPI</div>
  <div class="index-value" id="indexVal"><span class="loading-text">···</span></div>
  <div class="change-row" id="changeRow">
    <span class="change-badge flat" id="changeBadge">—</span>
    <span class="change-badge flat" id="changePctBadge">—</span>
  </div>
  <div class="market-status" id="marketStatus"></div>

  <hr class="divider">

  <div class="meta">
    <span>
      <span class="status-dot loading" id="statusDot"></span>
      <span id="statusText">불러오는 중...</span>
    </span>
    <span id="updateTime">—</span>
  </div>

  <div class="error-msg" id="errorMsg" style="display:none"></div>
  <button class="refresh-btn" onclick="fetchKospi()">새로고침</button>
</div>

<script>
const PROXY = 'https://query1.finance.yahoo.com/v8/finance/chart/%5EKS11?interval=1d&range=5d';

function fmt(n, digits = 2) {
  return n.toLocaleString('ko-KR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function now() {
  return new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function setError(msg) {
  document.getElementById('statusDot').className = 'status-dot error';
  document.getElementById('statusText').textContent = '오류';
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorMsg').style.display = 'block';
  document.getElementById('updateTime').textContent = now();
}

async function fetchKospi() {
  document.getElementById('statusDot').className = 'status-dot loading';
  document.getElementById('statusText').textContent = '불러오는 중...';
  document.getElementById('errorMsg').style.display = 'none';

  try {
    const res = await fetch(PROXY, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const meta = data.chart.result[0].meta;
    const price = meta.regularMarketPrice;
    const prevClose = meta.chartPreviousClose ?? meta.previousClose;
    const change = price - prevClose;
    const changePct = (change / prevClose) * 100;
    const marketState = meta.marketState; // REGULAR, CLOSED, PRE, POST

    document.getElementById('indexVal').textContent = fmt(price, 2);

    const dir = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
    const arrow = change > 0 ? '▲' : change < 0 ? '▼' : '—';
    const sign = change > 0 ? '+' : '';

    const cb = document.getElementById('changeBadge');
    const cpb = document.getElementById('changePctBadge');
    cb.className = `change-badge ${dir}`;
    cpb.className = `change-badge ${dir}`;
    cb.innerHTML = `<span class="arrow">${arrow}</span> ${sign}${fmt(change, 2)}`;
    cpb.innerHTML = `${sign}${fmt(changePct, 2)}%`;

    const stateMap = { REGULAR: '장중', CLOSED: '장마감', PRE: '장전', POST: '시간외' };
    document.getElementById('marketStatus').textContent = stateMap[marketState] ?? marketState;

    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = '실시간';
    document.getElementById('updateTime').textContent = now();

  } catch (e) {
    setError('데이터를 가져올 수 없습니다. (' + e.message + ')');
  }
}

fetchKospi();
// 장중에는 30초마다, 아니면 5분마다 갱신
setInterval(fetchKospi, 30000);
</script>
</body>
</html>
